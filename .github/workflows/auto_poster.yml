name: Auto Reddit to Threads Poster

on:
  # 支援外部點火器 (如 cron-job.org) 呼叫 GitHub API 秒速觸發
  repository_dispatch:
    types: [external_trigger]
  # 支援在 GitHub 網頁上手動點擊立即測試
  workflow_dispatch:
  # 保留定時排程作為備援 (UTC 04:00, 10:00, 13:00 對應台灣 12:00, 18:00, 21:00)
  schedule:
    # 支援 GitHub 內建雲端定時 (覆蓋台灣日間與晚間主力時段)
    - cron: '45 0,2,4,6,8,10,11,13,14 * * *'

permissions:
  contents: write

jobs:
  run-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg (用於影音壓制)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Deps
        run: |
          playwright install chromium --with-deps

      - name: Run Main Poster Process
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          THREADS_SESSION_DATA: ${{ secrets.THREADS_SESSION_DATA }}
          X_SESSION_DATA: ${{ secrets.X_SESSION_DATA }}
          FACEBOOK_SESSION_DATA: ${{ secrets.FACEBOOK_SESSION_DATA }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          THREADS_USERNAME: ${{ secrets.THREADS_USERNAME }}
          THREADS_PASSWORD: ${{ secrets.THREADS_PASSWORD }}
        run: |
          python main.py --all

      - name: Commit and Push History & State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: sync cloud posting state and history [skip ci]" && git push)
